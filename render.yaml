services:
  - type: web
    name: ds-tools
    runtime: python
    plan: free              # Word-only tools are light. Use "starter" (~$7/mo) to avoid cold starts.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 600 --max-requests 60 --max-requests-jitter 15
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUNCHLIST_MODEL
        value: claude-sonnet-4-6
      - key: APP_PASSWORD
        sync: false          # optional: set a shared team password. Leave unset = open.
      - key: SMTP_HOST
        sync: false          # e.g. smtp.gmail.com (for the email buttons)
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false          # the sending mailbox, e.g. info@dspropertiesnc.com
      - key: SMTP_PASS
        sync: false          # app password for that mailbox
      - key: SMTP_FROM
        sync: false          # optional; defaults to SMTP_USER
