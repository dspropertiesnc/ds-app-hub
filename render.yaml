services:
  - type: web
    name: ds-tools
    runtime: python
    # MUST stay on a paid instance: Render blocks outbound SMTP (ports 25/465/587)
    # on FREE web services, which makes the email buttons hang. Starter also keeps
    # the service awake (no cold starts).
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 6 --timeout 600 --max-requests 60 --max-requests-jitter 15
    healthCheckPath: /
    autoDeploy: true
    # Persistent disk for saved renewal proposals (SQLite). Note: a service with a disk
    # restarts in place on deploy (a few seconds of downtime) instead of zero-downtime swaps.
    disk:
      name: ds-tools-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUNCHLIST_MODEL
        value: claude-sonnet-4-6
      - key: APP_PASSWORD
        sync: false          # optional: set a shared team password. Leave unset = open.
      - key: SMTP_HOST
        sync: false          # e.g. smtp.gmail.com (for the email buttons)
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false          # the sending mailbox, e.g. info@dspropertiesnc.com
      - key: SMTP_PASS
        sync: false          # app password for that mailbox
      - key: SMTP_FROM
        sync: false          # optional; defaults to SMTP_USER
      - key: LISTING_FROM
        value: listing-input@dspropertiesnc.com   # Listing Input Sheet sends from this alias
      - key: RENEWALS_DB
        value: /var/data/renewals.db              # saved renewal proposals (on the disk above)
      - key: RENTVINE_ACCOUNT
        value: dossspauldingpropertiesllc         # the subdomain in your Rentvine URL
      - key: RENTVINE_API_KEY
        sync: false          # Rentvine > Settings > Users, Roles & API > API key (access key)
      - key: RENTVINE_API_SECRET
        sync: false          # that key's secret (shown once when the key is created)
